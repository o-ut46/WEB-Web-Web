<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scale Layers v5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f9;color:#162539;font:15px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:1040px;margin:auto;padding:14px}h1{font-size:23px;margin:4px 0}p{margin:4px 0 14px;color:#506075}.card{background:white;border:1px solid #cbd5e1;border-radius:13px;padding:13px;margin:12px 0}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:6px;margin-bottom:13px}.tabs button{flex:1}.btn,button{font:inherit;cursor:pointer;border:1px solid #93a7bd;background:#f3f7fc;color:#162539;border-radius:9px;padding:10px 12px}button[aria-pressed=true],button[aria-selected=true]{background:#174f94;color:white;border-color:#174f94}.label{font-weight:800;margin:13px 0 7px}.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.picker button{padding:12px 3px;min-height:43px}.choice{width:100%;font-weight:750}.scales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.scales button{font-size:13px;text-align:left;min-height:44px}.muted{color:#58697c;font-size:13px}.boardscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}.neck{position:relative;width:1190px;height:250px;border:4px solid #7b4e2b;border-radius:7px;background:linear-gradient(#dfbc87,#b98753);touch-action:pan-x}.string{position:absolute;left:0;right:0;background:#e6edf3;box-shadow:0 1px 2px #655;pointer-events:none}.fret{position:absolute;top:0;bottom:0;width:3px;background:#ddd;box-shadow:1px 0 2px #666;pointer-events:none}.note{position:absolute;transform:translate(-50%,-50%);min-width:29px;height:30px;padding:0 3px;border-radius:30px;border:2px solid white;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 4px #3339;cursor:pointer}.note.root{outline:2px solid #172e49}.note.multi{border:3px double #fff;min-width:35px;font-size:9px}.fretnums{display:flex;width:1190px;font-size:11px;text-align:center;color:#34465a}.fretnums span:first-child{width:45px;flex:none}.fretnums span:not(:first-child){flex:1}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:10px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.layerstat{font-weight:bold}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.controls select{padding:10px;border-radius:8px;font-size:15px}.summary{line-height:2}.hidden{display:none!important}@media(max-width:600px){h1{font-size:21px}.card{padding:11px}.scales{grid-template-columns:repeat(2,1fr)}}

#viewport{height:650px;overflow:auto;position:relative;background:#e8edf3;border-radius:12px;padding:10px;touch-action:none}#stage{position:relative}#neck{position:absolute;left:0;top:0;width:1190px;height:290px;background:none;border:0;transform-origin:0 0;touch-action:none}.layerpanel{position:absolute;width:1190px;height:290px;touch-action:none}.layerhandle{height:36px;background:var(--color);color:white;border-radius:8px 8px 0 0;padding:8px 14px;font-weight:bold;cursor:grab;user-select:none}.realboard{position:relative;height:250px;border:4px solid #98683a;border-radius:0 0 10px 10px;background-image:repeating-linear-gradient(2deg,transparent 0px,#c18c4b18 2px,transparent 4px,transparent 11px);box-shadow:0 4px 10px #0003}.layerpanel:not(:first-child) .realboard{background-color:transparent!important;border-color:#98734b66}.fret{z-index:1;background:linear-gradient(90deg,#888,#fff,#999);width:3px}.fret.nut{width:7px;background:#f0e6c9}.string{z-index:2;background:linear-gradient(#fff,#b7b2a6,#777)}.note{z-index:3}.fnumber{position:absolute;top:225px;color:#fff;background:#162539b8;border-radius:3px;padding:1px 4px;transform:translateX(-50%);font-size:13px;z-index:4}.inlay{position:absolute;width:12px;height:12px;background:#e1d7bf;border-radius:50%;transform:translate(-50%,-50%)}.stringname{position:absolute;left:3px;color:#eee;font-size:9px;z-index:3;pointer-events:none}input[type=range]{width:140px;vertical-align:middle}
</style></head><body><main><h1>🎸 Scale Layers</h1><p>右向き指板：左がヘッド、右がボディ／上が1弦、下が6弦</p>
<section class="card"><div class="label">① レイヤー選択</div><div id="layerTabs" class="tabs"><button type="button" data-layer="0" aria-pressed="true">基本</button><button type="button" data-layer="1" aria-pressed="false">追加A</button><button type="button" data-layer="2" aria-pressed="false">追加B</button></div>
<div class="label">② キーを選ぶ</div><div id="keys" class="picker"><button type="button" data-key="0">C</button><button type="button" data-key="1">C♯/D♭</button><button type="button" data-key="2">D</button><button type="button" data-key="3">E♭</button><button type="button" data-key="4">E</button><button type="button" data-key="5">F</button><button type="button" data-key="6">F♯</button><button type="button" data-key="7">G</button><button type="button" data-key="8">A♭</button><button type="button" data-key="9">A</button><button type="button" data-key="10">B♭</button><button type="button" data-key="11">B</button></div>
<div class="label">③ スケールを選ぶ</div><div id="categoryTabs" class="tabs"><button type="button" data-cat="standard" aria-pressed="true">定番</button><button type="button" data-cat="mode" aria-pressed="false">モード</button><button type="button" data-cat="minor" aria-pressed="false">マイナー</button><button type="button" data-cat="other" aria-pressed="false">その他</button></div>
<div id="scaleChoices" class="scales"><button data-scale="major">メジャー</button><button data-scale="naturalMinor">ナチュラルマイナー</button><button data-scale="majorPent">メジャーペンタトニック</button><button data-scale="minorPent">マイナーペンタトニック</button><button data-scale="blues">ブルース</button></div>
<div class="label">④ 指板の表記</div><div id="labels" class="tabs"><button type="button" data-label="note" aria-pressed="true">アルファベット</button><button type="button" data-label="roman" aria-pressed="false">ローマ数字</button><button type="button" data-label="degree" aria-pressed="false">度数</button></div>
<div class="controls"><label><input id="visible" type="checkbox" checked> このレイヤーを表示</label><button id="minus" type="button">−半音</button><button id="plus" type="button">＋半音</button><button id="save" type="button">設定保存</button><button id="reset" type="button">初期化</button></div><p id="selection" class="layerstat">基本：C メジャー</p></section>
<section class="card"><div class="label">⑤ ギター指板</div><div class="controls"><button id="apart">別々に並べる</button><button id="stack">重ねる</button><label>縮小・拡大 <input id="zoom" type="range" min="25" max="120" value="65"> <span id="zoomValue">65%</span></label><button id="fit">画面に合わせる</button><label>選択レイヤーの濃さ <input id="opacity" type="range" min="15" max="100" value="80"></label></div><p class="muted">各レイヤーの見出し、または音のない部分を1本指で自由に移動。重ねると下の音も透けて見えます。2本指のピンチで全体を拡大・縮小。音はタップで再生。移動してもキーは変わりません。</p><div class="boardscroll" id="viewport"><div id="stage"><div id="neck"></div></div></div><div id="legend" class="legend"></div><p id="status" class="muted">準備完了</p></section>
<section class="card"><div class="label">構成音一覧</div><div id="summary" class="summary">C D E F G A B</div></section></main>
<script>
(function(){'use strict';
const scaleDef={major:['メジャー',[0,2,4,5,7,9,11],'standard'],naturalMinor:['ナチュラルマイナー',[0,2,3,5,7,8,10],'standard'],majorPent:['メジャーペンタトニック',[0,2,4,7,9],'standard'],minorPent:['マイナーペンタトニック',[0,3,5,7,10],'standard'],blues:['ブルース',[0,3,5,6,7,10],'standard'],dorian:['ドリアン',[0,2,3,5,7,9,10],'mode'],phrygian:['フリジアン',[0,1,3,5,7,8,10],'mode'],lydian:['リディアン',[0,2,4,6,7,9,11],'mode'],mixolydian:['ミクソリディアン',[0,2,4,5,7,9,10],'mode'],locrian:['ロクリアン',[0,1,3,5,6,8,10],'mode'],harmonicMinor:['ハーモニックマイナー',[0,2,3,5,7,8,11],'minor'],melodicMinor:['メロディックマイナー',[0,2,3,5,7,9,11],'minor'],altered:['オルタード',[0,1,3,4,6,8,10],'minor'],wholeTone:['ホールトーン',[0,2,4,6,8,10],'other'],dimHW:['ディミニッシュ H-W',[0,1,3,4,6,7,9,10],'other'],dimWH:['ディミニッシュ W-H',[0,2,3,5,6,8,9,11],'other'],chromatic:['クロマチック',Array.from({length:12},(_,i)=>i),'other'],hirajoshi:['平調子',[0,2,3,7,8],'other'],bebop:['ドミナント・ビバップ',[0,2,4,5,7,9,10,11],'other']};
const noteSharp=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],noteFlat=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'],degree=['1','♭2','2','♭3','3','4','♯4','5','♭6','6','♭7','7'],roman=['I','♭II','II','♭III','III','IV','♯IV','V','♭VI','VI','♭VII','VII'],open=[4,11,7,2,9,4],colors=['#2269c2','#c53d4f','#128366'];
const $=id=>document.getElementById(id),mod=n=>(n%12+12)%12;const initial=()=>[{key:0,scale:'major',label:'note',visible:true,offset:0},{key:9,scale:'minorPent',label:'roman',visible:true,offset:0},{key:7,scale:'mixolydian',label:'degree',visible:true,offset:0}];let layers=initial(),selected=0,category='standard',audio;
try{let saved=JSON.parse(localStorage.getItem('scale-layers-stable-v5'));if(Array.isArray(saved)&&saved.length===3&&saved.every(l=>scaleDef[l.scale]&&Number.isInteger(l.key)&&l.key>=0&&l.key<12))layers=saved;}catch(e){}
function name(pc,key){return ([1,3,5,8,10].includes(key)?noteFlat:noteSharp)[pc]};function label(l,pc){let d=mod(pc-l.key);return l.label==='note'?name(pc,l.key):l.label==='roman'?roman[d]:degree[d]}
function drawSelectors(){let l=layers[selected];document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layer===selected)));document.querySelectorAll('[data-key]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.key===l.key)));document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===category)));$('scaleChoices').replaceChildren();Object.keys(scaleDef).filter(k=>scaleDef[k][2]===category).forEach(k=>{let b=document.createElement('button');b.type='button';b.textContent=scaleDef[k][0];b.setAttribute('aria-pressed',String(l.scale===k));b.onclick=()=>{l.scale=k;update()};$('scaleChoices').append(b)});document.querySelectorAll('[data-label]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.label===l.label)));$('visible').checked=l.visible;$('selection').textContent=['基本','追加A','追加B'][selected]+'：'+name(l.key,l.key)+' '+scaleDef[l.scale][0]}
const W=1190,H=290,step=1145/24;let zoom=.65,zTop=3;let positions=[{x:0,y:0},{x:0,y:310},{x:0,y:620}],alphas=[.8,.8,.8];
function geometry(){ $('neck').style.transform='scale('+zoom+')';$('stage').style.width=(W+Math.max(0,...positions.map(p=>p.x)))*zoom+'px';$('stage').style.height=(H+Math.max(0,...positions.map(p=>p.y)))*zoom+'px';$('zoom').value=Math.round(zoom*100);$('zoomValue').textContent=Math.round(zoom*100)+'%'}
function drawBoard(){let target=$('neck');target.replaceChildren();layers.forEach((l,i)=>{if(!l.visible)return;let panel=document.createElement('div');panel.className='layerpanel';panel.style.left=positions[i].x+'px';panel.style.top=positions[i].y+'px';panel.style.setProperty('--color',colors[i]);panel.style.zIndex=i+1;let title=document.createElement('div');title.className='layerhandle';title.textContent=['基本','追加A','追加B'][i]+'　'+name(l.key,l.key)+' '+scaleDef[l.scale][0]+'　⠿ 指で移動';panel.append(title);let board=document.createElement('div');board.className='realboard';board.style.backgroundColor='#382219';panel.append(board);
for(let f=0;f<=24;f++){let line=document.createElement('i');line.className='fret';line.style.left=(45+f*step)+'px';if(f===0)line.classList.add('nut');board.append(line)}
for(let f of [1,3,5,7,9,12,15,17,19,21,24]){let n=document.createElement('b');n.className='fnumber';n.style.left=(45+(f-.5)*step)+'px';n.textContent=f;board.append(n);if(f!==1){for(let y of ([12,24].includes(f)?[78,158]:[118])){let dot=document.createElement('i');dot.className='inlay';dot.style.left=(45+(f-.5)*step)+'px';dot.style.top=y+'px';board.append(dot)}}}
for(let st=0;st<6;st++){let wire=document.createElement('div');wire.className='string';wire.style.top=(22+st*40)+'px';wire.style.height=(1+st*.65)+'px';board.append(wire);let sn=document.createElement('small');sn.className='stringname';sn.style.top=(12+st*40)+'px';sn.textContent=(st+1)+' '+['E','B','G','D','A','E'][st];board.append(sn);for(let f=0;f<=24;f++){let pc=mod(open[st]+f);if(!scaleDef[l.scale][1].includes(mod(pc-l.key)))continue;let n=document.createElement('div');n.className='note'+(mod(pc-l.key)===0?' root':'');n.style.left=(f===0?21:45+(f-.5)*step)+'px';n.style.top=(22+st*40)+'px';n.style.background=colors[i];n.style.opacity=alphas[i];n.textContent=label(l,pc);n.onclick=()=>play(pc);board.append(n)}}
let drag=null;panel.addEventListener('pointerdown',e=>{if(e.target.closest('.note'))return;selected=i;drawSelectors();$('opacity').value=alphas[i]*100;panel.style.zIndex=++zTop;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:positions[i].x,py:positions[i].y};panel.setPointerCapture(e.pointerId)});panel.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||touches.size>1)return;positions[i].x=Math.max(0,drag.px+(e.clientX-drag.x)/zoom);positions[i].y=Math.max(0,drag.py+(e.clientY-drag.y)/zoom);panel.style.left=positions[i].x+'px';panel.style.top=positions[i].y+'px';geometry()});const stop=()=>drag=null;panel.addEventListener('pointerup',stop);panel.addEventListener('pointercancel',stop);target.append(panel)});
$('legend').innerHTML=layers.map((l,i)=>'<span style="color:'+colors[i]+'">● '+['基本','追加A','追加B'][i]+' '+name(l.key,l.key)+' '+scaleDef[l.scale][0]+'</span>').join('');$('summary').innerHTML=layers.map((l,i)=>'<div><b>'+['基本','追加A','追加B'][i]+': '+name(l.key,l.key)+' '+scaleDef[l.scale][0]+'</b>　'+scaleDef[l.scale][1].map(d=>name(mod(l.key+d),l.key)).join('・')+'</div>').join('');geometry()}
function update(){drawSelectors();drawBoard()}function play(pc){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=261.63*Math.pow(2,pc/12);o.type='triangle';g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.46)}catch(e){}}
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{selected=+b.dataset.layer;category=scaleDef[layers[selected].scale][2];update()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{layers[selected].key=+b.dataset.key;layers[selected].offset=0;update()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;update()});document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{layers[selected].label=b.dataset.label;update()});$('visible').onchange=e=>{layers[selected].visible=e.target.checked;update()};$('minus').onclick=()=>{layers[selected].key=mod(layers[selected].key-1);update()};$('plus').onclick=()=>{layers[selected].key=mod(layers[selected].key+1);update()};$('save').onclick=()=>{try{localStorage.setItem('scale-layers-stable-v5',JSON.stringify(layers));$('status').textContent='設定を保存しました'}catch(e){$('status').textContent='保存できませんでした'}};$('reset').onclick=()=>{layers=initial();selected=0;category='standard';update()};
$('apart').onclick=()=>{positions=[{x:0,y:0},{x:0,y:310},{x:0,y:620}];update()};$('stack').onclick=()=>{positions=[{x:0,y:0},{x:0,y:0},{x:0,y:0}];update()};$('zoom').oninput=e=>{zoom=+e.target.value/100;geometry()};$('fit').onclick=()=>{zoom=Math.max(.25,Math.min(1.2,$('viewport').clientWidth/W));geometry()};$('opacity').oninput=e=>{alphas[selected]=+e.target.value/100;drawBoard()};
const touches=new Map();let pinch=null;let vp=$('viewport');vp.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){let t=[...touches.values()];pinch={d:Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y),z:zoom}}},true);vp.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){let t=[...touches.values()];zoom=Math.max(.25,Math.min(1.2,pinch.z*Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y)/Math.max(1,pinch.d)));geometry()}},true);for(let ev of ['pointerup','pointercancel'])window.addEventListener(ev,e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null});
update();
})();
</script></body></html>
